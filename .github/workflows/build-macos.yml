name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - master
    paths:
      - '.github/workflows/build-macos.yml'
      - 'package.json'
      - 'src/**'

permissions:
  contents: write
  issues: write

jobs:
  build-mac:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS (${{ matrix.arch }})
        id: build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # 서명/공증 완전 스킵
          CSC_IDENTITY: '-'
        run: |
          set -o pipefail
          npx electron-builder --mac zip --${{ matrix.arch }} 2>&1 | tee build.log
          # dmg는 zip 성공 후 추가 시도 (실패해도 zip은 유지)
          npx electron-builder --mac dmg --${{ matrix.arch }} 2>&1 | tee -a build.log || echo "dmg build failed (zip may still be ok)" >> build.log
          ls -lah dist/ | tee -a build.log
          # zip이 하나라도 있어야 성공
          test -n "$(ls dist/*.zip 2>/dev/null || true)"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.arch }}
          path: build.log
          if-no-files-found: ignore

      - name: Post failure log as issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## macOS ${{ matrix.arch }} build failed"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            tail -n 120 build.log || echo '(no log)'
            echo '```'
          } > /tmp/issue.md
          gh issue create --title "ci: macOS ${{ matrix.arch }} build failed (#${{ github.run_number }})" --body-file /tmp/issue.md || true

      - name: Prepare release assets
        id: assets
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          ARCH='${{ matrix.arch }}'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p release-out
          shopt -s nullglob
          for f in dist/*.zip dist/*.dmg; do
            base=$(basename "$f")
            ext="${base##*.}"
            out="AI-Usage-Dashboard-${VERSION}-mac-${ARCH}.${ext}"
            cp "$f" "release-out/$out"
            echo "Prepared $out"
          done
          ls -lah release-out/
          test -n "$(ls -A release-out)"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: release-out/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Release
    needs: build-mac
    runs-on: ubuntu-latest
    steps:
      - name: Download all mac artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          merge-multiple: true
          path: release-out

      - name: List files
        run: ls -lah release-out/

      - name: Read version
        id: ver
        run: |
          f=$(ls release-out/AI-Usage-Dashboard-*-mac-*.* | head -n1)
          ver=$(basename "$f" | sed -E 's/^AI-Usage-Dashboard-([0-9.]+)-mac-.+$/\1/')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-out/*
          fail_on_unmatched_files: true
          body: |
            ## macOS
            - `AI-Usage-Dashboard-*-mac-arm64.zip` / `.dmg` — Apple Silicon
            - `AI-Usage-Dashboard-*-mac-x64.zip` / `.dmg` — Intel

            코드 서명이 없어 처음 실행 시 Gatekeeper 경고가 나면 우클릭 → 열기, 또는 **시스템 설정 → 개인 정보 보호 및 보안**에서 허용하세요.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
