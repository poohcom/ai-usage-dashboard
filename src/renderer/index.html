<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>AI Usage Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo"></span>
      <h1 data-i18n="app.title">AI Usage Dashboard</h1>
      <span class="sub" id="lastRefresh"></span>
    </div>
    <div class="actions">
      <button id="refreshAll" class="primary" data-i18n="ui.refreshAll">Refresh all</button>
      <button id="openSettings" class="ghost" type="button" data-i18n="ui.settings">Settings</button>
    </div>
  </header>

  <main class="scroll"><div id="grid" class="grid"></div></main>

  <footer class="foot">
    <span data-i18n="ui.footer"></span>
  </footer>

  <div id="settingsOverlay" class="overlay" hidden>
    <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="settings-head">
        <h2 id="settingsTitle" data-i18n="ui.settings">Settings</h2>
        <button id="closeSettings" class="icon" type="button" aria-label="Close">✕</button>
      </div>
      <div class="settings-body">
        <section class="settings-section">
          <h3 data-i18n="ui.settingsGeneral">General</h3>
          <label class="settings-row">
            <span data-i18n="ui.language">Language</span>
            <select id="language">
              <option value="auto" data-i18n="ui.lang.auto">System</option>
              <option value="ko">한국어</option>
              <option value="en">English</option>
            </select>
          </label>
          <label class="settings-row">
            <span data-i18n="ui.autoRefresh">Auto refresh</span>
            <select id="interval">
              <option value="60" data-min="1"></option>
              <option value="180" data-min="3"></option>
              <option value="300" data-min="5"></option>
              <option value="600" data-min="10"></option>
              <option value="1800" data-min="30"></option>
            </select>
          </label>
        </section>
        <section class="settings-section">
          <h3 data-i18n="ui.settingsProviders">Show on dashboard</h3>
          <p class="settings-hint" data-i18n="ui.settingsProvidersHint">Toggle which AI cards appear on the main screen.</p>
          <div id="providerToggles" class="provider-toggles"></div>
        </section>
      </div>
    </div>
  </div>

  <template id="cardTpl">
    <section class="card">
      <div class="card-head">
        <div class="title">
          <span class="dot"></span>
          <h2 class="name"></h2>
          <span class="badge plan"></span>
        </div>
        <div class="tools">
          <button class="icon refresh">⟳</button>
        </div>
      </div>
      <div class="meta">
        <span class="account"></span>
        <span class="source"></span>
      </div>
      <div class="body"></div>
      <div class="extra"></div>
      <div class="card-foot">
        <span class="fetched"></span>
        <div class="foot-actions">
          <button class="link login"></button>
          <button class="link logout"></button>
          <button class="link raw"></button>
        </div>
      </div>
      <pre class="rawbox" hidden></pre>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
